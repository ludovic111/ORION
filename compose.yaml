services:
  orion:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_MODE: institution
      REAL_OPERATIONS_ENABLED: ${REAL_OPERATIONS_ENABLED:-false}
      HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:?Set the institution HTTPS origin}
      DATABASE_URL: ${DATABASE_URL:?Set the institution PostgreSQL application connection}
      DATABASE_CA_FILE: /run/secrets/postgres-ca.pem
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      APP_KEY: ${APP_KEY:?Set a random 32-byte hex encryption key}
    volumes:
      - ${DATABASE_CA_FILE:?Set the local CA certificate path}:/run/secrets/postgres-ca.pem:ro
    ports:
      - "127.0.0.1:4311:4311"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
