name: ORION checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orion_test
          POSTGRES_PASSWORD: test-only-local-ci
          POSTGRES_DB: orion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://orion_test:test-only-local-ci@127.0.0.1:5432/orion_test
      - run: npm run build:pages
      - run: npx wrangler pages functions build --cwd pages --build-output-directory ../dist-pages --outdir ../.data/pages-check
      - run: npm run test:cloudflare
      - run: npx wrangler deploy --dry-run
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t orion:ci .
